<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>MIGRA · 当前离线</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f9f9; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #dbe4e7; border-radius: 24px; background: white; box-shadow: 0 16px 48px rgba(15, 35, 45, .08); }
      .mark { display: grid; width: 52px; height: 52px; place-items: center; border-radius: 16px; background: #e6f5f3; color: #0f766e; font-size: 26px; }
      h1 { margin: 20px 0 8px; font-size: 24px; }
      p { margin: 0; color: #64748b; line-height: 1.7; }
      button { width: 100%; margin-top: 24px; padding: 13px 18px; border: 0; border-radius: 14px; background: #0f766e; color: white; font-size: 15px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">↻</div>
      <h1>当前没有网络连接</h1>
      <p>MIGRA 不会在离线状态保存或补发订单、收付款和材料操作。恢复网络后请重新打开页面。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
